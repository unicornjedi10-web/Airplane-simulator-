<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Study Flight Simulator</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #87CEEB; }
  canvas { display: block; margin: 0 auto; background: #87CEEB; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; width: 300px; }
  h2 { margin: 5px 0; }
  button { margin: 2px 0; width: 100%; }
  .panel { margin-top: 10px; padding: 5px; border-top: 1px solid #ccc; }
</style>
</head>
<body>

<div id="ui">
  <h2>Pilot Study Flight Simulator</h2>
  
  <div>
    <label>Throttle: <span id="throttleDisplay">0</span>%</label>
    <input type="range" id="throttle" min="0" max="100" value="0">
  </div>
  
  <div>
    <label>Flaps: <span id="flapsDisplay">0</span>°</label>
    <input type="range" id="flaps" min="0" max="30" value="0">
  </div>

  <div class="panel">
    <h3>Aircraft Info</h3>
    <p>Altitude: <span id="altitude">0</span> ft</p>
    <p>Speed: <span id="speed">0</span> knots</p>
    <p>Pitch: <span id="pitch">0</span>°</p>
    <p>Bank: <span id="bank">0</span>°</p>
  </div>

  <div class="panel">
    <h3>Study Info</h3>
    <p id="studyInfo">Hover over controls to see info.</p>
  </div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let throttle = 0;
let flaps = 0;
let altitude = 1000; // in feet
let speed = 0; // knots
let pitch = 0;
let bank = 0;

document.getElementById('throttle').addEventListener('input', e => {
  throttle = parseInt(e.target.value);
  document.getElementById('throttleDisplay').innerText = throttle;
});

document.getElementById('flaps').addEventListener('input', e => {
  flaps = parseInt(e.target.value);
  document.getElementById('flapsDisplay').innerText = flaps;
});

// Study info for each control
const studyData = {
  throttle: "Throttle controls engine power and affects speed and climb rate. Ref: FAA PHAK Chapter 4.",
  flaps: "Flaps increase lift and drag, allowing slower flight for takeoff and landing. Ref: FAA PHAK Chapter 5."
};

document.getElementById('throttle').addEventListener('mouseover', () => {
  document.getElementById('studyInfo').innerText = studyData.throttle;
});
document.getElementById('throttle').addEventListener('mouseout', () => {
  document.getElementById('studyInfo').innerText = "Hover over controls to see info.";
});

document.getElementById('flaps').addEventListener('mouseover', () => {
  document.getElementById('studyInfo').innerText = studyData.flaps;
});
document.getElementById('flaps').addEventListener('mouseout', () => {
  document.getElementById('studyInfo').innerText = "Hover over controls to see info.";
});

// Keyboard controls
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp': pitch += 2; break;
    case 'ArrowDown': pitch -= 2; break;
    case 'ArrowLeft': bank -= 5; break;
    case 'ArrowRight': bank += 5; break;
  }
});

// Simulation update loop
function update() {
  // Simplified physics for fun
  speed = throttle * 1.5 - flaps * 0.5;
  altitude += (speed / 60) * Math.sin(pitch * Math.PI/180);
  
  // Clamp values
  altitude = Math.max(0, altitude);
  speed = Math.max(0, speed);
  
  // Update UI
  document.getElementById('altitude').innerText = altitude.toFixed(0);
  document.getElementById('speed').innerText = speed.toFixed(0);
  document.getElementById('pitch').innerText = pitch;
  document.getElementById('bank').innerText = bank;

  draw();
  requestAnimationFrame(update);
}

// Simple airplane drawing
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw horizon
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height/2);
  ctx.fillStyle = '#228B22';
  ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);

  // Draw airplane (triangle)
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(bank * Math.PI / 180);
  ctx.fillStyle = 'red';
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-15, 10);
  ctx.lineTo(15, 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Start simulation
update();
</script>
</body>
</html>
