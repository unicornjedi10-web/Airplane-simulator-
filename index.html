<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Cockpit Learning Game</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background: #333; color: #fff; }
#cockpit { display: flex; justify-content: space-between; padding: 10px; }
#controls, #info { width: 25%; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
#instruments { width: 50%; text-align: center; }
button, input[type=range] { width: 100%; margin: 5px 0; }
canvas { display:block; margin:0 auto; background:#87CEEB; }
.panel { margin-top:10px; padding:5px; border-top:1px solid #ccc; color:#fff; }
</style>
</head>
<body>

<div id="cockpit">
  <div id="controls">
    <h2>Controls</h2>
    <label>Throttle <span id="throttleDisplay">0</span>%</label>
    <input type="range" id="throttle" min="0" max="100" value="0">

    <label>Flaps <span id="flapsDisplay">0</span>°</label>
    <input type="range" id="flaps" min="0" max="30" value="0">

    <label>Yoke Pitch</label>
    <input type="range" id="pitchControl" min="-15" max="15" value="0">

    <label>Yoke Bank</label>
    <input type="range" id="bankControl" min="-30" max="30" value="0">
  </div>

  <div id="instruments">
    <h2>Instruments</h2>
    <canvas id="horizon" width="300" height="300"></canvas>
    <div class="panel">
      <p>Altitude: <span id="altitude">1000</span> ft</p>
      <p>Speed: <span id="speed">0</span> knots</p>
      <p>Pitch: <span id="pitch">0</span>°</p>
      <p>Bank: <span id="bank">0</span>°</p>
    </div>
  </div>

  <div id="info">
    <h2>Study Info</h2>
    <p id="studyInfo">Hover over controls for info.</p>
  </div>
</div>

<script>
let throttle = 0, flaps = 0, pitch = 0, bank = 0;
let altitude = 1000, speed = 0;

const studyData = {
  throttle: "Throttle: Controls engine power, affects climb and speed. Ref: FAA PHAK Ch.4",
  flaps: "Flaps: Increase lift & drag for slow flight, takeoff & landing. Ref: FAA PHAK Ch.5",
  pitchControl: "Yoke Pitch: Controls aircraft nose up/down. Ref: FAA PHAK Ch.3",
  bankControl: "Yoke Bank: Controls roll/turn. Ref: FAA PHAK Ch.3"
};

function updateUI(){
  document.getElementById('throttleDisplay').innerText = throttle;
  document.getElementById('flapsDisplay').innerText = flaps;
  document.getElementById('altitude').innerText = altitude.toFixed(0);
  document.getElementById('speed').innerText = speed.toFixed(0);
  document.getElementById('pitch').innerText = pitch;
  document.getElementById('bank').innerText = bank;
}

// Controls events
document.getElementById('throttle').addEventListener('input', e=>{ throttle = +e.target.value; updateUI(); });
document.getElementById('flaps').addEventListener('input', e=>{ flaps = +e.target.value; updateUI(); });
document.getElementById('pitchControl').addEventListener('input', e=>{ pitch = +e.target.value; updateUI(); });
document.getElementById('bankControl').addEventListener('input', e=>{ bank = +e.target.value; updateUI(); });

// Hover study info
['throttle','flaps','pitchControl','bankControl'].forEach(id=>{
  document.getElementById(id).addEventListener('mouseover', ()=>{ document.getElementById('studyInfo').innerText = studyData[id]; });
  document.getElementById(id).addEventListener('mouseout', ()=>{ document.getElementById('studyInfo').innerText = "Hover over controls for info."; });
});

// Horizon canvas
const canvas = document.getElementById('horizon');
const ctx = canvas.getContext('2d');

function drawHorizon(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Draw sky
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0,0,canvas.width,canvas.height/2 + pitch*5);
  // Draw ground
  ctx.fillStyle = '#228B22';
  ctx.fillRect(0,canvas.height/2 + pitch*5,canvas.width,canvas.height/2 - pitch*5);
  // Draw plane symbol
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2 -20, canvas.height/2);
  ctx.lineTo(canvas.width/2 +20, canvas.height/2);
  ctx.moveTo(canvas.width/2, canvas.height/2 -10);
  ctx.lineTo(canvas.width/2, canvas.height/2 +10);
  ctx.stroke();
}

function simulate(){
  // Very simple physics for learning
  speed = throttle*1.5 - flaps*0.5;
  altitude += (speed/60) * Math.sin(pitch*Math.PI/180);
  altitude = Math.max(0, altitude);
  updateUI();
  drawHorizon();
  requestAnimationFrame(simulate);
}

simulate();
</script>
</body>
</html>
