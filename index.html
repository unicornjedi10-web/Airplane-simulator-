<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Flight Simulator</title>
<style>
  body { margin: 0; font-family: sans-serif; overflow: hidden; background: #87ceeb; }
  #gameCanvas { display: block; background: #87ceeb; }
  #ui { position: absolute; top: 10px; left: 10px; color: white; }
  .menu { background: rgba(0,0,0,0.6); padding: 10px; margin-bottom: 10px; border-radius: 8px; }
  button { margin: 5px; padding: 5px 10px; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div class="menu">
    <h3>Settings</h3>
    Weather: 
    <select id="weatherSelect">
      <option value="clear">Clear</option>
      <option value="cloudy">Cloudy</option>
      <option value="rain">Rain</option>
    </select>
    Time: 
    <select id="timeSelect">
      <option value="day">Day</option>
      <option value="night">Night</option>
    </select>
    <button onclick="toggleFOV()">Toggle FOV Mode</button>
  </div>

  <div class="menu">
    <h3>Cockpit Info</h3>
    <button onclick="showInfo()">Show Controls</button>
  </div>

  <div class="menu">
    <h3>Status</h3>
    <div>Speed: <span id="speedDisplay">0</span> km/h</div>
    <div>Altitude: <span id="altDisplay">0</span> m</div>
    <div>Landing Gear: <span id="gearDisplay">Up</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let plane = {
  x: canvas.width/2,
  y: canvas.height/2,
  speed: 0,
  altitude: 1000,
  angle: 0,
  gear: 'Up'
};

let fovMode = false;
let weather = 'clear';
let timeOfDay = 'day';

document.getElementById('weatherSelect').addEventListener('change', e => weather = e.target.value);
document.getElementById('timeSelect').addEventListener('change', e => timeOfDay = e.target.value);

function toggleFOV() {
  fovMode = !fovMode;
}

function showInfo() {
  alert(`Cockpit Controls:
- Throttle: Increase speed
- Landing Gear: Up/Down
- Radar: Shows nearby terrain/buildings
- Altimeter: Shows altitude`);
}

// Simple crash detection
function checkCrash() {
  if (plane.altitude <= 0) {
    alert('CRASH! Game Over');
    plane.speed = 0;
    plane.altitude = 0;
  }
}

// Main render function
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Sky background
  if (timeOfDay === 'day') ctx.fillStyle = weather === 'clear' ? '#87ceeb' : '#a0a0a0';
  else ctx.fillStyle = '#0b0b2f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Clouds
  if(weather !== 'clear') {
    ctx.fillStyle = 'white';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(100+i*200,(i*80)%canvas.height,50,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Buildings/terrain
  ctx.fillStyle = '#555';
  ctx.fillRect(canvas.width/2-50, canvas.height-100, 100, 100); // simple ground obstacle

  // Artificial Horizon
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(plane.angle * Math.PI / 180);
  ctx.fillStyle = 'brown';
  ctx.fillRect(-canvas.width/2, 100, canvas.width, 20); // ground line
  ctx.fillStyle = 'skyblue';
  ctx.fillRect(-canvas.width/2, -canvas.height/2, canvas.width, 100); // sky
  ctx.restore();

  // Cockpit controls
  if(!fovMode){
    ctx.fillStyle = 'black';
    ctx.fillRect(0, canvas.height-150, canvas.width, 150); // cockpit panel
    ctx.fillStyle = 'white';
    ctx.fillText(`Throttle: ${plane.speed}`, 50, canvas.height-100);
    ctx.fillText(`Altitude: ${plane.altitude}`, 200, canvas.height-100);
    ctx.fillText(`Landing Gear: ${plane.gear}`, 400, canvas.height-100);
  }

  requestAnimationFrame(render);
}

render();

// Simple controls
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp') { plane.speed += 5; plane.altitude += 10; }
  if(e.key === 'ArrowDown') { plane.speed -= 5; plane.altitude -= 10; }
  if(e.key === 'ArrowLeft') plane.angle -= 2;
  if(e.key === 'ArrowRight') plane.angle += 2;
  if(e.key === 'g') plane.gear = plane.gear === 'Up' ? 'Down' : 'Up';
  checkCrash();
});
</script>

</body>
</html>
