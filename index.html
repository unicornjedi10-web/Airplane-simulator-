<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Cockpit Flight Simulator</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background:#333; color:#fff; }
#cockpit { display:flex; justify-content:space-between; padding:10px; }
#controls,#settings,#info { width:20%; background:rgba(0,0,0,0.7); padding:10px; border-radius:8px; }
#instruments { width:40%; text-align:center; }
canvas { display:block; margin:0 auto; border:1px solid #000; }
h2 { margin:5px 0; }
button,input[type=range],select { width:100%; margin:5px 0; }
.panel { margin-top:10px; padding:5px; border-top:1px solid #ccc; color:#fff; }
</style>
</head>
<body>

<div id="cockpit">
  <div id="controls">
    <h2>Flight Controls</h2>
    <label>Throttle <span id="throttleDisplay">0</span>%</label>
    <input type="range" id="throttle" min="0" max="100" value="0">
    <label>Flaps <span id="flapsDisplay">0</span>°</label>
    <input type="range" id="flaps" min="0" max="30" value="0">
    <label>Yoke Pitch</label>
    <input type="range" id="pitchControl" min="-15" max="15" value="0">
    <label>Yoke Bank</label>
    <input type="range" id="bankControl" min="-30" max="30" value="0">
    <label>Landing Gear</label>
    <select id="gearControl">
      <option value="up">Up</option>
      <option value="down">Down</option>
    </select>
  </div>

  <div id="instruments">
    <h2>Instruments</h2>
    <canvas id="horizon" width="300" height="300"></canvas>
    <canvas id="radar" width="150" height="150" style="margin-top:10px; border:1px solid white;"></canvas>
    <div class="panel">
      <p>Altitude: <span id="altitude">1000</span> ft</p>
      <p>Speed: <span id="speed">0</span> knots</p>
      <p>Pitch: <span id="pitch">0</span>°</p>
      <p>Bank: <span id="bank">0</span>°</p>
    </div>
  </div>

  <div id="settings">
    <h2>Settings</h2>
    <label>Day/Night</label>
    <select id="dayNight"><option value="day">Day</option><option value="night">Night</option></select>
    <label>Wind (0–20 knots)</label>
    <input type="range" id="wind" min="0" max="20" value="0">
    <label>Radar</label>
    <select id="radarToggle"><option value="on">On</option><option value="off">Off</option></select>
    <label>Aircraft Type</label>
    <select id="aircraftType"><option value="C172">Cessna 172</option><option value="SR22">Cirrus SR22</option></select>
  </div>

  <div id="info">
    <h2>Study Info</h2>
    <p id="studyInfo">Hover over controls for FAA guidance.</p>
  </div>
</div>

<canvas id="world" width="800" height="400"></canvas>

<script>
let throttle=0, flaps=0, pitch=0, bank=0, altitude=1000, speed=0, wind=0;
let dayNight='day', radarOn=true, gear='up', aircraft='C172';

// Buildings and clouds
const buildings=Array.from({length:20},()=>({x:Math.random()*800,y:300+Math.random()*50,w:20+Math.random()*30,h:50+Math.random()*100}));
const clouds=Array.from({length:10},()=>({x:Math.random()*800,y:50+Math.random()*100,w:50+Math.random()*50,h:20+Math.random()*20}));

// Study data
const studyData={
  throttle:"Throttle: Controls engine power, affects climb & speed. Ref: FAA PHAK Ch.4",
  flaps:"Flaps: Increase lift/drag for slow flight & landing. Ref: FAA PHAK Ch.5",
  pitchControl:"Yoke Pitch: Nose up/down. Ref: FAA PHAK Ch.3",
  bankControl:"Yoke Bank: Roll/turn. Ref: FAA PHAK Ch.3",
  gearControl:"Landing Gear: Up/Down affects drag & landing. Ref: FAA PHAK Ch.5",
  dayNight:"Toggle day/night for visibility. Ref: FAA PHAK Ch.9",
  wind:"Wind affects ground track. Ref: FAA PHAK Ch.8",
  radarToggle:"Radar shows terrain & clouds. Ref: FAA PHAK Ch.7",
  aircraftType:"Select aircraft type. Affects speed & climb. Ref: FAA PHAK Ch.2"
};

function updateUI(){
  document.getElementById('throttleDisplay').innerText=throttle;
  document.getElementById('flapsDisplay').innerText=flaps;
  document.getElementById('altitude').innerText=altitude.toFixed(0);
  document.getElementById('speed').innerText=speed.toFixed(0);
  document.getElementById('pitch').innerText=pitch;
  document.getElementById('bank').innerText=bank;
}

['throttle','flaps','pitchControl','bankControl','gearControl','dayNight','wind','radarToggle','aircraftType'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{ 
    if(id==='throttle') throttle=+el.value;
    if(id==='flaps') flaps=+el.value;
    if(id==='pitchControl') pitch=+el.value;
    if(id==='bankControl') bank=+el.value;
    if(id==='wind') wind=+el.value;
    updateUI();
  });
  el.addEventListener('change',()=>{
    if(id==='dayNight') dayNight=el.value;
    if(id==='radarToggle') radarOn=el.value==='on';
    if(id==='gearControl') gear=el.value;
    if(id==='aircraftType') aircraft=el.value;
  });
  el.addEventListener('mouseover',()=>{document.getElementById('studyInfo').innerText=studyData[id];});
  el.addEventListener('mouseout',()=>{document.getElementById('studyInfo').innerText="Hover over controls for FAA guidance."});
});

const world=document.getElementById('world'), wctx=world.getContext('2d');
const horizon=document.getElementById('horizon'), hctx=horizon.getContext('2d');
const radar=document.getElementById('radar'), rctx=radar.getContext('2d');

function drawHorizon(){
  hctx.clearRect(0,0,horizon.width,horizon.height);
  hctx.fillStyle=dayNight==='day'?'#87CEEB':'#001033';
  hctx.fillRect(0,0,horizon.width,horizon.height/2 + pitch*5);
  hctx.fillStyle='#228B22';
  hctx.fillRect(0,horizon.height/2 + pitch*5,horizon.width,horizon.height/2 - pitch*5);
  hctx.strokeStyle='white';hctx.lineWidth=2;
  hctx.beginPath();
  hctx.moveTo(horizon.width/2-20,horizon.height/2);
  hctx.lineTo(horizon.width/2+20,horizon.height/2);
  hctx.moveTo(horizon.width/2,horizon.height/2-10);
  hctx.lineTo(horizon.width/2,horizon.height/2+10);
  hctx.stroke();
}

function drawWorld(){
  wctx.clearRect(0,0,world.width,world.height);
  wctx.fillStyle=dayNight==='day'?'#87CEEB':'#001033';
  wctx.fillRect(0,0,world.width,world.height);
  clouds.forEach(c=>{
    c.x-=0.5 + wind*0.1; if(c.x+c.w<0) c.x=world.width;
    wctx.fillStyle='white'; wctx.fillRect(c.x,c.y,c.w,c.h);
  });
  buildings.forEach(b=>{
    const bx=(b.x-world.width/2)+world.width/2; wctx.fillStyle='#555'; wctx.fillRect(bx,b.y,b.w,b.h);
  });
  wctx.fillStyle='red'; wctx.beginPath(); wctx.arc(world.width/2,world.height/2,5,0,2*Math.PI); wctx.fill();
}

function drawRadar(){
  rctx.clearRect(0,0,radar.width,radar.height);
  if(!radarOn) return;
  rctx.fillStyle='black'; rctx.fillRect(0,0,radar.width,radar.height);
  clouds.forEach(c=>{
    const x=radar.width/2+(c.x-world.width/2)/4;
    const y=radar.height/2+(c.y-world.height/2)/4;
    rctx.fillStyle='white'; rctx.fillRect(x,y,2,2);
  });
  buildings.forEach(b=>{
    const x=radar.width/2+(b.x-world.width/2)/4;
    const y=radar.height/2+(b.y-world.height/2)/4;
    rctx.fillStyle='gray'; rctx.fillRect(x,y,2,2);
  });
  rctx.fillStyle='red'; rctx.fillRect(radar.width/2-2,radar.height/2-2,4,4);
}

function simulate(){
  speed=throttle*1.5 - flaps*0.5;
  if(gear==='down') speed*=0.95;
  altitude+=(speed/60)*Math.sin(pitch*Math.PI/180);
  altitude=Math.max(0,altitude);
  updateUI();
  drawHorizon();
  drawWorld();
  drawRadar();
  requestAnimationFrame(simulate);
}

simulate();
</script>
</body>
</html>
